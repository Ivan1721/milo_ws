<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Milo en el navegador</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1e23; color: #e6e9ee;
      font: 13px system-ui, sans-serif; }
    #panel { position: absolute; top: 10px; left: 10px; width: 260px; padding: 10px 12px;
      background: rgba(20, 23, 28, 0.88); border-radius: 6px; }
    #panel h1 { font-size: 15px; margin: 0 0 6px; }
    #panel p { margin: 4px 0 8px; color: #b8c0cc; }
    .fila { display: grid; grid-template-columns: 92px 1fr 46px; gap: 6px; align-items: center;
      margin: 3px 0; }
    .fila input { width: 100%; }
    .fila span { text-align: right; font-variant-numeric: tabular-nums; }
    button { margin: 6px 4px 0 0; }
    #estado { margin-top: 8px; color: #f3c27a; min-height: 2.6em; }
    #vista-camara { position: absolute; right: 10px; bottom: 10px; width: 320px; height: 240px;
      border: 2px solid #eb6834; }
    #vista-camara-titulo { position: absolute; right: 14px; bottom: 254px; color: #eb6834; }
  </style>
</head>
<body>
  <div id="panel">
    <h1>Milo</h1>
    <p>Arrastra la esfera naranja y suéltala: la cinemática inversa mueve el brazo y el lift.
       Teclas: <b>W</b> mover, <b>E</b> girar el objetivo.</p>
    <div id="articulaciones"></div>
    <button id="abrir">Abrir pinza</button><button id="cerrar">Cerrar pinza</button>
    <button id="mirar-mesa">Mirar la mesa</button>
    <div id="estado">Cargando…</div>
  </div>
  <div id="vista-camara"></div>
  <div id="vista-camara-titulo">Cámara de la pinza (color)</div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
