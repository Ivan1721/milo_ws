# Controladores del brazo de Milo en Gazebo (los carga el plugin gazebo_ros2_control de
# andesrobot.arm_control.xacro; los arranca el spawner de arm_sim.launch.py).
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    # Publica /joint_states del brazo, el lift y la pinza.
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # Brazo + lift en una sola trayectoria (así la IK de 7 articulaciones los mueve sincronizados).
    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    # Pinza: los dos dedos, mandados por fuerza y en espejo (izquierdo = −derecho).
    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

arm_controller:
  ros__parameters:
    joints:
      - vertical_lift_joint
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6
    # Mando por VELOCIDAD (ver andesrobot.arm_control.xacro): el controlador manda a cada
    # articulación la velocidad de la trayectoria más una corrección proporcional al error:
    #   velocidad = ff_velocity_scale · v_trayectoria + p · (posición pedida − posición)
    # Antes iba por posición, pero Gazebo "teletransporta" la articulación a la posición pedida
    # en cada paso, sin velocidad, y el roce de los dedos no arrastra un objeto agarrado: al
    # subir el lift con una caja entre los dedos, la caja subió 0 mm (medido el 7-nov con
    # scripts/prueba_levantar.py). Con velocidad la caja sube con la pinza.
    command_interfaces:
      - velocity
    state_interfaces:
      - position
      - velocity
    # Ganancias:
    #   ff_velocity_scale = 1: sigue la velocidad de la trayectoria; el P solo corrige el error.
    #   p [1/s]: con un error de 0.01 rad corrige a 0.2 rad/s. El peso hunde un poco cada
    #     articulación en cada paso de la física y el P lo devuelve; queda un error fijo chico
    #     (≈ 1e-5 rad en el brazo). El lift carga todo el brazo y se hundía 9 mm con p = 20
    #     (sin ff_velocity_scale); con p = 60 queda 0.3 mm abajo. Sin I ni D: no hicieron falta.
    # Probado el 7-nov: prueba de humo completa en verde, con MoveIt y con arm_ik_node.
    gains:
      vertical_lift_joint: {p: 60.0, i: 0.0, d: 0.0, i_clamp: 0.0, ff_velocity_scale: 1.0}
      joint_1: {p: 20.0, i: 0.0, d: 0.0, i_clamp: 0.0, ff_velocity_scale: 1.0}
      joint_2: {p: 20.0, i: 0.0, d: 0.0, i_clamp: 0.0, ff_velocity_scale: 1.0}
      joint_3: {p: 20.0, i: 0.0, d: 0.0, i_clamp: 0.0, ff_velocity_scale: 1.0}
      joint_4: {p: 20.0, i: 0.0, d: 0.0, i_clamp: 0.0, ff_velocity_scale: 1.0}
      joint_5: {p: 20.0, i: 0.0, d: 0.0, i_clamp: 0.0, ff_velocity_scale: 1.0}
      joint_6: {p: 20.0, i: 0.0, d: 0.0, i_clamp: 0.0, ff_velocity_scale: 1.0}
    # Se puede mandar solo una parte de las articulaciones (p. ej. joint_1..6): las demás se quedan quietas.
    allow_partial_joints_goal: true
    # La trayectoria debe terminar con velocidad 0 (las de arm_ik_node tienen un solo punto, sin
    # velocidad: cumplen). Se fija explícito porque el valor por defecto va a cambiar.
    allow_nonzero_velocity_at_trajectory_end: false
    # TOLERANCIAS: si al terminar el tiempo de la trayectoria + goal_time alguna articulación quedó
    # más lejos que "goal" de su objetivo, el controlador aborta con GOAL_TOLERANCE_VIOLATED y
    # arm_ik_node lo avisa. OJO: en Gazebo con mando por posición eso casi nunca ocurría, porque
    # un choque no frenaba el brazo (las articulaciones eran rígidas) sino que movía la base
    # entera (ver docs/BRAZO.md, "Limitaciones"); con mando por velocidad no se volvió a medir.
    # Sirven de red de seguridad para el robot real con
    # encoders; no son una detección de choques.
    #   goal        error máximo al final [rad o m]
    #   trajectory  error máximo DURANTE el movimiento (0 = no se revisa). Está en 0: con el brazo
    #               pesado podría abortar movimientos normales; probar antes de activarlo.
    #   goal_time   margen [s] para llegar después del tiempo pedido
    #   stopped_velocity_tolerance  velocidad [rad/s] bajo la que se considera detenido
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 1.0
      vertical_lift_joint: {trajectory: 0.0, goal: 0.005}
      joint_1: {trajectory: 0.0, goal: 0.02}
      joint_2: {trajectory: 0.0, goal: 0.02}
      joint_3: {trajectory: 0.0, goal: 0.02}
      joint_4: {trajectory: 0.0, goal: 0.02}
      joint_5: {trajectory: 0.0, goal: 0.02}
      joint_6: {trajectory: 0.0, goal: 0.02}

gripper_controller:
  ros__parameters:
    # Las metas tienen que traer los dos dedos, con valores opuestos: abierta [0.016, -0.016],
    # cerrada [-0.007, 0.007]. Una meta con un solo dedo se rechaza (sin allow_partial_joints_goal)
    # para que la pinza no quede abierta de un lado.
    joints:
      - right_finger_joint
      - left_finger_joint
    allow_nonzero_velocity_at_trajectory_end: false
    # Sin tolerancia de meta a propósito: al agarrar un objeto los dedos quedan frenados antes de
    # llegar a la posición pedida, y eso es lo esperado, no una falla.
    # Mando por ESFUERZO (ver andesrobot.arm_control.xacro): el controlador sigue la trayectoria
    # con un PID que da una fuerza [N] y Gazebo la recorta a gripper_force (20 N, en el URDF).
    command_interfaces:
      - effort
    state_interfaces:
      - position
      - velocity
    # Ganancias del PID. Solo P: fuerza = p · (posición pedida − posición del dedo).
    #   p = 10000 N/m: a 2 mm del objetivo el dedo ya empuja con los 20 N del tope. Al cerrar
    #     sobre un objeto el objetivo queda "dentro" del objeto, el error no baja de unos mm y el
    #     dedo empuja siempre con el tope: así se frena contra el objeto sin atravesarlo.
    #   PARA AGARRAR, mandar cada dedo 2 mm más adentro que el ancho del objeto, no "cerrar del
    #     todo": cada dedo empuja p·2 mm = 20 N, y si el objeto se corre hacia un lado, un dedo
    #     empuja más que el otro y lo devuelve al centro. Cerrando del todo los dos empujan con
    #     el tope, nada los centra y el objeto se va de lado (medido: 3.8 mm en 10 s con 1 kg).
    #     En la pinza real lo centra el piñón, que mueve los dos dedos a la vez.
    #   No hace falta D: el freno lo pone el amortiguamiento del dedo (gripper_damping, en el
    #     URDF, resuelto por Gazebo de forma estable). Con p/b = 10000/400 el dedo llega a su
    #     objetivo en ~0.04 s (constante de tiempo), y el lazo a 100 Hz queda estable
    #     (p·dt/b = 0.25, hace falta < 2).
    #   No hace falta I: el peso del dedo (~22 g, 0.2 N) deja un error de 0.02 mm.
    # Al arrancar, el controlador avisa que falta 'ff_velocity_scale' (término de velocidad):
    # no importa, vale 0 por defecto, que es lo que se quiere.
    # Probado el 7-nov con scripts/prueba_pinza.py: contra cajas fijas de 10 a 45 mm la apertura
    # queda a menos de 0.1 mm del ancho y tiembla menos de 0.25 mm; en vacío cierran del todo.
    # Con scripts/prueba_levantar.py: una caja suelta de 30 mm y 0.1 a 0.5 kg sube 5 cm con la
    # pinza y en 10 s se corre 0.05–0.4 mm (8 de 8); con 1 kg resbala 2–3 mm (no pasa).
    gains:
      right_finger_joint: {p: 10000.0, i: 0.0, d: 0.0, i_clamp: 0.0}
      left_finger_joint: {p: 10000.0, i: 0.0, d: 0.0, i_clamp: 0.0}
