# brazo_real.yaml — los números del brazo REAL que necesita brazo_real_node para pasar de
# radianes (ROS, MoveIt) a pasos del Arduino (firmware/brazo_mega/brazo_mega.ino) y al revés.
# Ver la fórmula en andesrobot_arm/brazo_real.py. Los marcados "SUPUESTO" no se han medido.
#
#   pasos_motor  pasos por vuelta del motor: 200 en un motor de 1.8° (SUPUESTO, ver la placa
#                del motor; 400 si es de 0.9°)
#   micropasos   lo que dicen los interruptores SW1-SW3 de cada TB6600 (SUPUESTO 1/8 -> 8;
#                tiene que ser el mismo número que esté puesto en cada driver)
#   reduccion    vueltas del motor por vuelta de la articulación: 38.4 (dato del equipo:
#                "todos los motores tienen una caja reductora de 38.4:1")
#   invertir     true si al pedir un ángulo positivo la articulación gira al revés que en RViz
#                (se descubre probando una por una con firmware/probar_arduino.py)
#   cero         [rad] ángulo de la articulación cuando el Arduino cuenta 0 pasos. El Arduino
#                arranca en 0 al encenderse (no hay finales de carrera): se enciende con el brazo
#                en esta pose. 0.0 = la pose cero del URDF (la que muestra RViz con todo en 0).
#                Hoy todas tienen otro (ver "Pose de arranque" abajo).
comun:
  pasos_motor: 200
  micropasos: 8
  reduccion: 38.4
  invertir: false
  cero: 0.0

# Lo que sea distinto en una articulación va aquí (por ejemplo, joint_1: {invertir: true}).
#
# Pose de arranque (26-nov-2026, decisión del equipo): el brazo NO arranca en la pose cero del URDF
# (todo en 0 = brazo hacia arriba) sino ESTIRADO HACIA ADELANTE, horizontal, con la pinza en lo más
# lejos que alcanza al frente (x 0.94, y -0.09, z 1.03 m en base_footprint) y apuntando adelante;
# la altura del brazo es la fija del lift (lift_fijo). Es una pose fácil de dejar y de repetir a
# mano, sin encoders ni IMU. Hay 4 combinaciones que dejan así la pinza (J1/J2 ±90° y la muñeca
# arriba o abajo); el brazo real está en esta ("la 3" de las que se compararon el 26-nov: la
# muñeca hacia arriba, y hombro y codo en espejo de J1 +90°/J2 +90°):
#   J1 -90°, J2 -90°, J3 0, J4 +90°, J5 +90°, J6 0
# (figura: ros2_ws/src/andesrobot_arm/docs/figuras/pose_arranque.png). El Arduino cuenta 0 pasos en
# esa pose, así que su `cero` es ese ángulo [rad]. Comprobar al arrancar, sin mover nada: el brazo
# de RViz tiene que verse igual que el real.
articulaciones:
  # J1, J2 y J3 giran al revés que en el URDF (probado el 26-nov con los sliders: subir el slider
  # movía el brazo real hacia el lado contrario que RViz). J4, J5 y J6 giran bien.
  joint_1: {cero: -1.5707963, invertir: true}
  joint_2: {cero: -1.5707963, invertir: true}
  joint_3: {invertir: true}
  joint_4: {cero: 1.5707963}
  joint_5: {cero: 1.5707963}
  joint_6: {}

# Servo de la garra: ángulos [grados] con la garra abierta (dedos a 0.016 m) y cerrada
# (-0.007 m). Desde el 25-nov el servo es de 270° y el firmware v5 lo maneja de 0 a 297° (pulso de
# 400 a 2600 µs). El equipo probó los topes con el control (brazo_driver.yaml: abre hacia 297,
# cierra hacia 0), y el 26-nov se vio con los sliders que con 40/110 abrir y cerrar iban al revés.
# Si un tope fuerza el servo (zumba o se calienta), acercar el valor al otro.
garra:
  servo_abierta: 297
  servo_cerrada: 0
