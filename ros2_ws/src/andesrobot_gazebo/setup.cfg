# setup.cfg: le dice a Python dónde instalar los ejecutables del paquete.
# ROS 2 los busca en install/<paquete>/lib/<paquete>/ (por eso "ros2 run" los encuentra).
# [develop] se usa con colcon build --symlink-install; [install] con un build normal.
[develop]
script_dir=$base/lib/andesrobot_gazebo
[install]
install_scripts=$base/lib/andesrobot_gazebo
