# Solver de cinemática inversa pick_ik (PickNik) para el grupo `brazo`. Se elige al lanzar:
#   ros2 launch andesrobot_arm arm_sim.launch.py ik:=pick_ik
# Con el valor por defecto (ik:=kdl) se usa kinematics.yaml y este archivo no se carga.
#
# Por qué pick_ik: KDL falla a veces cerca de los límites de las articulaciones y con la
# redundancia del lift (7 ejes para 6 restricciones). TRAC-IK resolvería eso, pero NO tiene
# paquete para ROS 2 Humble (no está en el índice oficial de rosdistro); pick_ik sí
# (ros-humble-pick-ik, instalado en docker/Dockerfile) y es un reemplazo directo.
#
# SIN PROBAR en la simulación del brazo: los nombres y valores de abajo son los del README de
# pick_ik; si al arrancar move_group se queja de algún parámetro, comparar con la versión
# instalada (ros2 pkg prefix pick_ik) y ajustar. Medir antes de dejarlo por defecto: cuántas
# poses de prueba_gazebo.sh resuelve y cuánto tarda cada una frente a KDL.
brazo:
  kinematics_solver: pick_ik/PickIkPlugin
  # Tiempo máximo por intento (s) y número de intentos con arranques distintos.
  kinematics_solver_timeout: 0.05
  kinematics_solver_attempts: 3
  # global: búsqueda evolutiva + descenso del gradiente (más robusta); local: solo el gradiente
  # desde la postura actual (más rápida, puede quedarse en un mínimo local).
  mode: global
  # Cuánto pesa el error de posición frente al de orientación en la función de costo.
  position_scale: 1.0
  rotation_scale: 0.5
  # La solución se acepta si queda a menos de esto de la meta (m y rad).
  position_threshold: 0.001
  orientation_threshold: 0.01
  cost_threshold: 0.001
  # Prefiere la solución más cercana a la postura actual (0 = no importa).
  minimal_displacement_weight: 0.0
  gd_step_size: 0.0001
