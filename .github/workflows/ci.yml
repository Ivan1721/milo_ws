# CI de milo_ws: tres comprobaciones rápidas que no necesitan ROS ni Docker.
#
#   pruebas  pytest de lo que corre sin ROS: andesrobot_safety, torques, medidas y la revisión de
#            documentos. Las pruebas de cinemática (test_kinematics.py) y la prueba de humo de
#            Gazebo necesitan ROS y la imagen de Docker: se siguen corriendo a mano dentro del
#            contenedor (ver CLAUDE.md, sección Commands).
#   estilo   flake8 a 99 columnas en el brazo (andesrobot_arm), su descripción y la config de MoveIt.
#   docs     scripts/revisar_docs.py: enlaces y anclas rotos, figuras en orden, \operatorname
#            (GitHub no lo muestra) y que un «N de N pruebas» del informe coincida con el código.
#
# Corre en cada push a brazo y main, y en cada pull request. Si falla, la pestaña Actions del
# repo dice qué línea o qué documento. Para probarlo en tu PC, los mismos comandos de abajo.
name: CI

on:
  push:
    branches: [brazo, main]
  pull_request:

# Un push nuevo a la misma rama cancela la corrida anterior que seguía en marcha.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Solo lectura: el CI no necesita escribir nada en el repo.
permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'   # el Python de Ubuntu 22.04 / ROS 2 Humble
          cache: pip
          cache-dependency-path: .github/workflows/ci.yml
      - run: pip install numpy pytest
      - name: andesrobot_safety
        run: cd ros2_ws/src/andesrobot_safety && python -m pytest -q test
      - name: andesrobot_arm (las que no necesitan ROS)
        run: |
          cd ros2_ws/src/andesrobot_arm
          python -m pytest -q test/test_torques.py test/test_medidas.py test/test_revisar_docs.py \
            test/test_moveit_opciones.py test/test_manija.py

  estilo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: .github/workflows/ci.yml
      - run: pip install flake8
      - name: flake8 (99 columnas)
        run: |
          python -m flake8 --max-line-length=99 \
            ros2_ws/src/andesrobot_arm ros2_ws/src/andesrobot_description \
            ros2_ws/src/andesrobot_moveit_config

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: revisar_docs.py
        run: python ros2_ws/src/andesrobot_arm/scripts/revisar_docs.py
